services:
  backend:
      build: ./backend/d-money-tracker
      env_file:
        - .env
      depends_on:
        - postgres

  postgres:
      image: postgres:17
      restart: always
      volumes:
        - postgres_data:/var/lib/postgresql/data
      env_file:
        - .env

  frontend:
      build:
        context: ./frontend/d-money-tracker-frontend
        dockerfile: Dockerfile
        args:
          VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
      env_file:
        - .env

  nginx:
      image: nginx
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx:/etc/nginx/conf.d
        - ./certbot/conf:/etc/letsencrypt
        - ./certbot/www:/var/www/certbot
      depends_on:
        - backend
        - frontend
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
volumes:
  postgres_data: