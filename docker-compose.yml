services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: dmoneytracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  nginx:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static
      - ./media:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web


  web:
    image: ghcr.io/hiteshmohite19/d-money-tracker:latest
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DJANGO_SETTINGS_MODULE: dmoneytracker.settings.production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      DB_NAME: dmoneytracker
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn dmoneytracker.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  postgres_data:
  static_volume:
