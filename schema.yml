components:
  schemas:
    Category:
      type: object
      description: Serializer for Category model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Category name (must be unique)
          maxLength: 100
        active:
          type: boolean
          description: Whether this category is currently active
        last_update_by:
          type: string
          format: uuid
          nullable: true
          description: User ID who last updated this category
        last_update_at:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp of the last update
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - last_update_at
      - name
      - updated_at
    CategoryList:
      type: object
      description: Lightweight serializer for listing categories.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Category name (must be unique)
          maxLength: 100
        active:
          type: boolean
          description: Whether this category is currently active
      required:
      - id
      - name
    CategoryRequest:
      type: object
      description: Serializer for Category model.
      properties:
        name:
          type: string
          minLength: 1
          description: Category name (must be unique)
          maxLength: 100
        active:
          type: boolean
          description: Whether this category is currently active
        last_update_by:
          type: string
          format: uuid
          nullable: true
          description: User ID who last updated this category
      required:
      - name
    EndUser:
      type: object
      description: Full serializer for EndUser model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          description: User's first name
          maxLength: 100
        last_name:
          type: string
          description: User's last name
          maxLength: 100
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          description: User's email address
          maxLength: 255
        mobile:
          type: string
          description: User's mobile number (unique)
          pattern: ^\+?1?\d{9,15}$
          maxLength: 20
        is_active:
          type: boolean
          description: Whether this user account is currently active
        mobile_verified:
          type: boolean
          description: Whether the mobile number has been verified
        email_verified:
          type: boolean
          description: Whether the email address has been verified
        verification_status:
          type: string
          readOnly: true
        income:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: User's monthly income
        estimated_expense:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: User's estimated monthly expenses
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: User ID who created this end user
        updated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: User ID who last updated this end user
      required:
      - created_at
      - created_by
      - email
      - first_name
      - full_name
      - id
      - last_name
      - mobile
      - updated_at
      - updated_by
      - verification_status
    EndUserCreateUpdate:
      type: object
      description: |-
        Serializer for creating/updating end users.
        Excludes audit fields which are set automatically.
      properties:
        first_name:
          type: string
          description: User's first name
          maxLength: 100
        last_name:
          type: string
          description: User's last name
          maxLength: 100
        email:
          type: string
          format: email
          description: User's email address
          maxLength: 255
        mobile:
          type: string
          description: User's mobile number (unique)
          pattern: ^\+?1?\d{9,15}$
          maxLength: 20
        is_active:
          type: boolean
          description: Whether this user account is currently active
        mobile_verified:
          type: boolean
          description: Whether the mobile number has been verified
        email_verified:
          type: boolean
          description: Whether the email address has been verified
        income:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: User's monthly income
        estimated_expense:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: User's estimated monthly expenses
      required:
      - email
      - first_name
      - last_name
      - mobile
    EndUserCreateUpdateRequest:
      type: object
