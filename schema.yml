  /api/categories/:
    get:
      operationId: categories_list
      description: |-
        ViewSet for managing categories.

        Provides CRUD operations:
        - list: GET /api/categories/
        - create: POST /api/categories/
        - retrieve: GET /api/categories/{id}/
        - update: PUT /api/categories/{id}/
        - partial_update: PATCH /api/categories/{id}/
        - destroy: DELETE /api/categories/{id}/

        Custom actions:
        - active: GET /api/categories/active/ — list only active categories
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - categories
      security:
      - cookieAuth: []
      - tokenAuth: []
      - TokenAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryListList'
          description: ''
    post:
      operationId: categories_create
      description: |-
        ViewSet for managing categories.

        Provides CRUD operations:
