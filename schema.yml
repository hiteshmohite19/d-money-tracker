        - list: GET /api/endusers/
        - create: POST /api/endusers/
        - retrieve: GET /api/endusers/{id}/
        - update: PUT /api/endusers/{id}/
        - partial_update: PATCH /api/endusers/{id}/
        - destroy: DELETE /api/endusers/{id}/

